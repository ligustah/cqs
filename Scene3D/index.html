<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CQS Orbital Fleet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Stencil+Display:wght@600;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
  /* Single dark world: the page is a window onto space, so it commits to one look. */
  :root {
    color-scheme: dark;
    --void: #05070d;
    --glass: rgba(9, 13, 22, 0.74);
    --glass-edge: rgba(231, 227, 218, 0.12);
    --bone: #e7e3da;
    --muted: #8e97aa;
    --signal: #ff5a14;
    --cobalt: #4d74ff;
    --ok: #3ddc97;
    --bad: #ff5d5d;
    --display: "Big Shoulders Stencil Display", "Arial Narrow", Impact, sans-serif;
    --body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--void); color: var(--bone); font: 14px/1.45 var(--body); overflow: hidden; }
  #app { position: fixed; inset: 0; }
  #scene { display: block; width: 100%; height: 100%; touch-action: none; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .ship-label { display: grid; gap: 1px; text-align: center; font: 500 11px/1.2 var(--mono); color: var(--bone); text-shadow: 0 1px 6px #000; }
  #loading { position: fixed; inset: 0; display: grid; place-content: center; gap: 8px; text-align: center; background: var(--void); z-index: 5; transition: opacity 0.6s; }
  #loading b { font: 800 34px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; }
  #loading span { color: var(--muted); font: 500 12px var(--mono); }
  #loading.done { opacity: 0; pointer-events: none; }
  #loading.failed { opacity: 1; pointer-events: auto; z-index: 20; padding: 16px; }
  #loading.failed span { max-width: 34em; line-height: 1.5; }
  #loading .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 8px; }
  #loading .actions a { color: var(--void); background: var(--bone); border-radius: 4px; padding: 9px 12px; font: 600 12px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none; }
  .ship-label.row { text-align: left; justify-items: start; }
  /* scale chart annotation (src/lib/chart.js): neutral technical-drawing callouts and ruler */
  .chart { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .chart .callout, .chart .tick { position: absolute; left: 0; top: 0; white-space: nowrap; text-shadow: 0 1px 3px #000, 0 0 6px #000; }
  .chart .callout { display: grid; justify-items: end; gap: 2px; text-align: right; font: 500 11px/1.15 var(--mono); color: var(--muted); }
  .chart .callout b { font: 800 15px/1 var(--display); letter-spacing: 0.08em; text-transform: uppercase; color: var(--bone); }
  .chart .tick { font: 500 10px/1 var(--mono); color: #aab0ba; font-variant-numeric: tabular-nums; }
  .chart .leader { fill: none; stroke: rgba(214, 218, 226, 0.5); stroke-width: 1; }
  .chart .anchor { fill: #e7e3da; }
  .chart .base, .chart .tick0, .chart .tick1, .chart .tick2 { stroke: rgba(214, 218, 226, 0.62); stroke-width: 1; }
  .chart .tick0 { stroke: rgba(214, 218, 226, 0.4); }
  .ship-label b { font: 800 18px/1 var(--display); letter-spacing: 0.06em; text-transform: uppercase; color: var(--signal); }

  #ui { position: fixed; inset: 0; pointer-events: none; padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: minmax(0, 340px) 1fr minmax(0, 320px); grid-template-rows: auto 1fr auto; gap: 16px; box-sizing: border-box; }
  #ui > * { pointer-events: auto; }
  .panel { background: var(--glass); border: 1px solid var(--glass-edge); border-radius: 6px; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  header { grid-column: 1 / 3; display: flex; flex-wrap: wrap; align-items: end; gap: 12px 24px; pointer-events: none; }
  header > * { pointer-events: auto; }
  .brand h1 { margin: 0; font: 800 clamp(30px, 4.2vw, 46px)/0.9 var(--display); letter-spacing: 0.04em; text-transform: uppercase; text-wrap: balance; }
  .brand h1 span { color: var(--signal); }
  .brand p { margin: 6px 0 0; color: var(--muted); font-size: 12px; letter-spacing: 0.02em; }
  .modes { display: inline-flex; flex-wrap: wrap; align-items: center; padding: 3px; gap: 3px; max-width: 100%; }
  .modes .sep { width: 1px; align-self: stretch; margin: 4px 3px; background: var(--glass-edge); }
  .modes button { font: 600 12px/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); background: none; border: 0; border-radius: 4px; padding: 9px 12px; cursor: pointer; }
  .modes button[aria-pressed="true"] { background: var(--bone); color: var(--void); }
  .modes button:hover:not([aria-pressed="true"]) { color: var(--bone); }

  #registry-wrap { grid-column: 1; grid-row: 3; padding: 10px; align-self: end; }
  #registry-wrap h2, #sheet h3 { margin: 2px 6px 8px; font: 600 11px/1 var(--body); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
  #registry { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
  #registry button { width: 100%; display: grid; grid-template-columns: 1fr auto; grid-template-areas: "name len" "cls slots"; gap: 1px 12px; text-align: left; background: none; border: 0; border-left: 3px solid transparent; border-radius: 3px; color: var(--bone); padding: 7px 8px; cursor: pointer; font: inherit; }
  #registry button:hover { background: rgba(231, 227, 218, 0.06); }
  #registry button[aria-current="true"] { border-left-color: var(--signal); background: rgba(255, 90, 20, 0.10); }
  .reg-name { grid-area: name; font: 800 17px/1.05 var(--display); letter-spacing: 0.05em; text-transform: uppercase; }
  .reg-class { grid-area: cls; color: var(--muted); font-size: 12px; }
  .reg-len { grid-area: len; font: 500 13px/1.1 var(--mono); font-variant-numeric: tabular-nums; text-align: right; }
  .reg-slots { grid-area: slots; font: 400 11px/1.3 var(--mono); color: var(--muted); text-align: right; }

  #sheet { grid-column: 3; grid-row: 2 / 4; align-self: end; padding: 16px; max-height: 100%; overflow: auto; box-sizing: border-box; }
  #sheet .eyebrow { margin: 0 0 4px; font: 500 11px/1.3 var(--mono); letter-spacing: 0.06em; color: var(--signal); }
  #sheet h2 { margin: 0; font: 800 28px/0.95 var(--display); letter-spacing: 0.04em; text-transform: uppercase; text-wrap: balance; }
  #sheet .role { margin: 8px 0 12px; color: #c4c8d2; max-width: 36ch; }
  .specs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 16px; margin: 0; }
  .specs div { border-top: 1px solid var(--glass-edge); padding-top: 6px; }
  .specs dt { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
  .specs dd { margin: 2px 0 0; font: 500 15px/1.2 var(--mono); font-variant-numeric: tabular-nums; }
  #sheet h3 { margin: 16px 0 6px; }
  #sheet .art { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; align-items: start; }
  #sheet .art figure { margin: 0; }
  #sheet .art img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; border-radius: 4px; border: 1px solid var(--glass-edge); background: #0b0d12; }
  #sheet .art figure + figure img { aspect-ratio: 4 / 3; object-fit: contain; background: #d7d8da; }
  #sheet .art figcaption, #sheet .gen { margin: 4px 0 0; font: 500 10px/1.3 var(--mono); letter-spacing: 0.04em; color: var(--muted); }
  .dims { margin: 0 0 8px; font: 500 13px var(--mono); }
  .loads { width: 100%; border-collapse: collapse; font: 13px var(--mono); font-variant-numeric: tabular-nums; }
  .loads th { text-align: left; font: 500 10px var(--body); letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 4px 0; }
  .loads td { padding: 4px 0; border-top: 1px solid var(--glass-edge); }
  .loads tr.ok td:last-child { color: var(--ok); }
  .loads tr.bad td:last-child { color: var(--bad); }

  .lineup-inset { position: absolute; z-index: 2; box-sizing: border-box; border: 1px solid rgba(215, 220, 228, 0.55); pointer-events: none; }
  .lineup-inset span { position: absolute; left: 0; top: 0; padding: 3px 7px; background: rgba(4, 6, 10, 0.78); font: 500 10px/1.3 var(--mono); letter-spacing: 0.04em; color: #c3c8d0; pointer-events: auto; }
  .lineup-inset a { color: var(--bone); text-underline-offset: 2px; }
  .toggles { grid-column: 2; grid-row: 3; align-self: end; justify-self: center; display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 8px 12px; font-size: 12px; color: var(--muted); }
  .toggles label { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
  .toggles input { accent-color: var(--signal); }
  .toggles .detail-link { color: var(--bone); text-underline-offset: 3px; }
  .hint { color: var(--muted); }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--signal); outline-offset: 2px; }

  /* short viewports (1280 x 800 and below): a tighter sheet with smaller concept thumbnails, so
     the whole sheet, both concept images included, fits without scrolling */
  @media (max-height: 860px) and (min-width: 861px) {
    #sheet { padding: 12px 14px; }
    #sheet h2 { font-size: 24px; }
    #sheet .role { margin: 6px 0 8px; line-height: 1.3; font-size: 12.5px; }
    .specs { gap: 4px 14px; }
    .specs div { padding-top: 4px; }
    .specs dd { font-size: 14px; }
    #sheet h3 { margin: 10px 0 4px; }
    .loads td, .loads th { padding: 2px 0; }
    #sheet .art img, #sheet .art figure + figure img { height: 64px; aspect-ratio: auto; }
  }
  @media (max-width: 860px) {
    #ui { grid-template-columns: 1fr; grid-template-rows: auto 1fr auto auto; gap: 10px; }
    header { grid-column: 1; }
    #sheet { grid-column: 1; grid-row: 4; max-height: 34vh; }
    #registry-wrap { grid-column: 1; grid-row: 3; }
    #registry { grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); }
    .toggles { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="loading" aria-live="polite"><b>Assembling fleet</b><span>Generating hulls, plating and planet…</span></div>
<script>
  // Fail visibly, never as a blank page: a load error, an uncaught error before the first frame, or a lost WebGL
  // context (src/main.js; phones drop it when graphics memory runs out) shows a message with a way out.
  window.__fail = function (title, detail) {
    if (window.__fatal) return;
    window.__fatal = title + (detail ? ': ' + detail : '');
    var el = document.getElementById('loading');
    if (!el) return;
    el.className = 'failed';
    el.hidden = false;
    var b = document.createElement('b'), s = document.createElement('span'), a = document.createElement('div');
    b.textContent = title;
    s.textContent = detail || '';
    a.className = 'actions';
    a.innerHTML = '<a href="#" id="fail-reload">Reload</a><a href="?#fighter">Open a single ship</a>';
    el.replaceChildren(b, s, a);
    document.getElementById('fail-reload').onclick = function (e) { e.preventDefault(); location.reload(); };
  };
  var early = function (msg) { if (!window.__ready) window.__fail('The 3D view could not load', String(msg || 'unknown error')); };
  // script errors, and a module script that fails to load (an image or font that fails is not fatal)
  window.addEventListener('error', function (e) {
    if (e instanceof ErrorEvent) early(e.message);
    else if (e.target && e.target.tagName === 'SCRIPT') early('could not load ' + e.target.src);
  }, true);
  window.addEventListener('unhandledrejection', function (e) { early(e.reason && (e.reason.message || e.reason)); });
</script>
<div id="app"></div>
<div id="ui">
  <header>
    <div class="brand">
      <h1>Orbital <span>Fleet</span></h1>
      <p>Conquer-Space reboot · carrier group at hangar-slot scale</p>
    </div>
    <div class="modes panel" role="group" aria-label="View">
      <button type="button" id="mode-fleet" data-mode="fleet">Fleet in orbit</button>
      <button type="button" id="mode-lineup" data-mode="lineup">Scale lineup</button>
      <span class="sep" aria-hidden="true"></span>
      <button type="button" id="mode-vehicle" data-mode="vehicle" title="V-31 ground vehicle (studio)">Vehicle</button>
      <button type="button" id="mode-shipyard" data-mode="shipyard" title="Planetside shipyard (building view)">Shipyard</button>
      <button type="button" id="mode-spaceport" data-mode="spaceport" title="SP-3 orbital spaceport (building view)">Spaceport</button>
    </div>
  </header>
  <section id="registry-wrap" class="panel" aria-label="Ship classes">
    <h2>Ship classes</h2>
    <ul id="registry"></ul>
  </section>
  <div class="toggles panel">
    <label><input type="checkbox" id="tg-orbit" data-toggle="orbit"> Auto-orbit</label>
    <label><input type="checkbox" id="tg-hangar" data-toggle="hangar"> Show 50-fighter hangar load</label>
    <a id="lineup-detail" class="detail-link" href="?lineup=small#lineup" hidden>Close-up: small ships</a>
    <span class="hint">Drag to orbit · scroll to zoom · double-click a ship</span>
  </div>
  <aside id="sheet" class="panel" aria-live="polite"></aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
